# Netlify hosts the website (Next.js). The crawler runs on GitHub Actions (.github/workflows/crawl.yml).
[build]
  command = "npm run build"
  publish = ".next"
  # Every production build costs Netlify credits. Skip it (exit 0) when nothing the website
  # uses changed since the last deploy: docs, tests, scripts, fixtures, GitHub workflows, *.md.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude).github' ':(exclude)scripts' ':(exclude)fixtures' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
